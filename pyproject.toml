[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eg606"
version = "0.1.0"
description = "ES606: speech-to-music transfer for stimulus-locked EEG decoding"
requires-python = ">=3.10"
dependencies = []  # the data downloaders are stdlib-only

[project.optional-dependencies]
prep = ["numpy", "scipy", "pandas", "pyarrow", "h5py", "pymatreader", "mne", "mne-bids"]
audio = ["numpy", "scipy", "soundfile", "librosa"]
train = ["torch", "hydra-core", "omegaconf"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
